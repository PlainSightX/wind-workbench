[project]
name = "power-forecast-service"
version = "0.1.0"
description = "Local renewable power forecasting prototype with validation and API delivery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "celery-types>=0.26.0",
  "celery[redis]>=5.4,<6",
  "dotenv>=0.9.9",
  "fastapi>=0.115,<1",
  "jupyter>=1.1.1",
  "langchain>=1.4.0",
  "langchain-deepseek>=1.1.0",
  "langgraph==1.2.11",
  "lightgbm==4.6.0",
  "mlflow-skinny==3.16.1",
  "numpy>=2.0,<3",
  "openai>=3.8.0",
  "pandas>=2.2,<3",
  "pandas-stubs~=2.3.3",
  "pgvector==0.4.2",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "torch==2.14.0+cu126",
  "transformers>=5.16.1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_forecast_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --strict-markers"
markers = [
  "unit: isolated rules and contracts; no external services",
  "integration: real component integration (local training or PostgreSQL)",
  "postgres: requires real PostgreSQL and creates an owned temporary database",
  "e2e: requires the running HTTP/PostgreSQL/Redis/worker stack; writes real experiments",
]

[tool.ruff]
line-length = 100

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
