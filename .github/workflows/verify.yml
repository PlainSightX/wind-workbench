name: Verify wind workbench
on: [push, pull_request]
jobs:
  windows-entrypoints:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the standalone test runner
        run: python -m pip install pytest==8.4.2
      - name: Verify eight PowerShell entrypoint boundaries
        shell: pwsh
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw 'pwsh is required; do not skip this group.' }
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          python -m pytest tests/unit/test_runtime_context.py --confcutdir tests/unit -k "not direct_diagnostic" -q
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: wind-ci
      WIND_HTTP_PORT: '18000'
      WIND_DB_PORT: '15433'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify replay coordinates and rebuild static assets
        working-directory: web
        run: |
          npm ci
          npx playwright test tests/chart-data.spec.js
          npm run build
          git diff --exit-code -- ../src/power_forecast_service/web_static
      - name: Create disposable credentials and start real services
        shell: bash
        run: |
          umask 077
          mkdir -p .local/runtime
          openssl rand -hex 32 > .local/runtime/postgres-password.txt
          openssl rand -hex 32 > .local/runtime/app-password.txt
          # 先登记脱敏，启动或失败诊断均不得公开临时密码。
          printf '::add-mask::%s\n' "$(cat .local/runtime/postgres-password.txt)"
          printf '::add-mask::%s\n' "$(cat .local/runtime/app-password.txt)"
          # runner owner + application group; no world-readable credentials.
          sudo chgrp -R 10001 .local/runtime
          chmod 2770 .local/runtime
          chmod 640 .local/runtime/*-password.txt
          mkdir .local/runtime/assistant
          sudo chgrp 10001 .local/runtime/assistant
          chmod 2770 .local/runtime/assistant
          # 文件型 secret 保留宿主权限：runner 和 app group 之外，只给实际 PG 身份读权。
          if ! command -v setfacl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends acl
          fi
          postgres_uid=$(docker compose --profile app run --rm --no-deps -T --entrypoint id postgres -u postgres)
          case "$postgres_uid" in
            ''|*[!0-9]*) printf 'Cannot resolve postgres image identity\n' >&2; exit 1 ;;
          esac
          sudo setfacl -m "u:${postgres_uid}:r" .local/runtime/app-password.txt
          docker compose --profile app run --rm --no-deps -T --user "$postgres_uid" --entrypoint sh postgres \
            -c 'test -r /run/secrets/app_password && test -s /run/secrets/app_password'
          docker compose --profile app up -d --build --wait --wait-timeout 120
      - name: Components, optional inference preflight and ordinary delivery (no real provider)
        shell: pwsh
        run: |
          & tools/dev/check-service.ps1 -TestPath @('tests/unit','tests/integration','tests/e2e/test_experiment_flow.py') -ReportName ci-service
      - name: Actual browser checks on the new experiment receipt
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/chart-data.spec.js tests/candidate.spec.js tests/navigation.spec.js tests/layout.spec.js
      - name: Retain only bounded browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            web/test-results/**/test-failed-*.png
            web/test-results/**/error-context.md
            .local/runtime/round3-ui/predict-mobile.png
            .local/runtime/round3-ui/mobile-layout.json
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Bounded failure diagnostics before disposable cleanup
        if: failure()
        shell: bash
        run: |
          docker compose --profile app ps --all
          docker compose --profile app logs --no-color --tail 120 postgres migrate api dispatcher worker
      - name: Stop only this disposable stack
        if: always()
        run: docker compose --profile app down --volumes
